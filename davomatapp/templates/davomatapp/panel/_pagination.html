{% if page.has_other_pages %}
<div class="pager">
  {% if page.has_previous %}
    <a class="btn secondary sm" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.previous_page_number }}">← Oldingi</a>
  {% endif %}
  <span class="muted">{{ page.number }} / {{ page.paginator.num_pages }} · jami {{ page.paginator.count }} ta</span>
  {% if page.has_next %}
    <a class="btn secondary sm" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.next_page_number }}">Keyingi →</a>
  {% endif %}
</div>
{% endif %}
